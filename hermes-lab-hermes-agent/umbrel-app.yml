manifestVersion: 1
id: hermes-lab-hermes-agent
name: Hermes Agent
tagline: A self-hosted AI agent with persistent memory and browser tools
icon: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/static/img/favicon.svg
