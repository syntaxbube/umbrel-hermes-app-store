name: Verify published OpenClaw runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-openclaw.yml', 'hermes-lab-openclaw-umbrel/**', 'scripts/validate.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate store and exercise actual Compose package
        env:
          APP_DATA_DIR: ${{ runner.temp }}/openclaw-compose-test
          APP_SEED: ci-disposable-compose-seed
        run: |
          set -euo pipefail
          python3 scripts/validate.py
          printf 'services:\n  app_proxy:\n    image: nginx:alpine\n' > "$RUNNER_TEMP/proxy-test.yml"
          docker compose -p package-test -f hermes-lab-openclaw-umbrel/docker-compose.yml -f "$RUNNER_TEMP/proxy-test.yml" config --quiet
          docker compose -p package-test -f hermes-lab-openclaw-umbrel/docker-compose.yml -f "$RUNNER_TEMP/proxy-test.yml" up -d server
          ready=false
          for attempt in $(seq 1 30); do
            if docker compose -p package-test -f hermes-lab-openclaw-umbrel/docker-compose.yml -f "$RUNNER_TEMP/proxy-test.yml" exec -T server curl -fsS http://127.0.0.1:18789/ > "$RUNNER_TEMP/setup-page.html"; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          grep -q 'OpenClaw' "$RUNNER_TEMP/setup-page.html"
          docker compose -p package-test -f hermes-lab-openclaw-umbrel/docker-compose.yml -f "$RUNNER_TEMP/proxy-test.yml" down
      - name: Verify anonymous pull and runtime compatibility
        env:
          IMAGE: ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8@sha256:2754e604a9d4a523dec67d5b1d821fde3c24bf708ca62def144c1440e622e3b6
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker network create wrapper-test
          docker volume create wrapper-data
          docker volume create wrapper-brew
          docker run --rm --user 0:0 --entrypoint /bin/sh -v wrapper-data:/data -v wrapper-brew:/home/linuxbrew "$IMAGE" -ec 'mkdir -p /data/.openclaw; printf "{\"wizard\":{\"lastRunVersion\":\"2026.9.8\"}}" > /data/.openclaw/openclaw.json; chown -R 1000:1000 /data /home/linuxbrew'
          docker run -d --name wrapper --network wrapper-test --init -e APP_SEED="$(openssl rand -hex 32)" -v wrapper-data:/data -v wrapper-brew:/home/linuxbrew --shm-size 1g "$IMAGE"
          ready=false
          for attempt in $(seq 1 90); do
            if docker run --rm --network wrapper-test --entrypoint curl "$IMAGE" -fsS http://wrapper:18789/ | grep -q data-openclaw-control-ui-build-id; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs wrapper; exit 1; fi
          docker run --rm --network wrapper-test --entrypoint node -e OPENCLAW_TEST_URL=http://wrapper:18789 -v "$PWD/build/openclaw-umbrel/test:/app/test:ro" "$IMAGE" /app/test/gateway-compatibility.cjs
      - name: Clean up disposable test resources
        if: always()
        run: |
          docker rm -f wrapper || true
          docker volume rm wrapper-data wrapper-brew || true
          docker network rm wrapper-test || true
