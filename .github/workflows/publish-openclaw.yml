name: Publish OpenClaw Umbrel
on:
  push:
    branches: [main]
    paths:
      - 'build/openclaw-umbrel/**'
      - '.github/workflows/publish-openclaw.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-openclaw
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: build/openclaw-umbrel
          load: true
          tags: ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/syntaxbube/umbrel-hermes-app-store
            org.opencontainers.image.version=2026.9.8
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify installed version and wrapper tests
        run: |
          docker run --rm --entrypoint openclaw ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-${{ matrix.arch }} --version
          docker run --rm --entrypoint node -w /app -v "$PWD/build/openclaw-umbrel/test:/app/test:ro" -v "$PWD/build/openclaw-umbrel/server.cjs:/app/server.cjs:ro" ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-${{ matrix.arch }} --test test/server.test.cjs test/onboard.test.cjs
      - name: Push tested native image
        run: docker push ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-${{ matrix.arch }}
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture index
        run: |
          docker buildx imagetools create --tag ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8 ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-amd64 ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8-arm64
          docker buildx imagetools inspect ghcr.io/syntaxbube/openclaw-umbrel:2026.9.8
